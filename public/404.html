<!doctype html>
<meta charset="utf-8" />
<title>obsidian4web</title>
<script>
  // Static hosts serve this for unknown paths (e.g. Obsidian's starter.html before the
  // service worker is active). Hand over to the launcher, which comes back afterwards.
  var p = location.pathname;
  var m = /^(.*\/app)\//.exec(p);
  var base = m ? m[1] + "/" : "/";
  location.replace(base + "?next=" + encodeURIComponent(p + location.search));
</script>
