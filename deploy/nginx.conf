# Example nginx site. Run the app with O4W_TRUST_PROXY=1.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name notes.example.com obsidian.example.org;   # any number of hostnames
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 64m;          # matches O4W_MAX_REQUEST_MB
    proxy_read_timeout 3600s;          # long-lived Sync WebSockets

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, don't append client-supplied values
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;                              # stream downloads
    }
}
